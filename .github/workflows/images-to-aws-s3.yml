name: Build images-to-aws-s3

on:
  push:
    paths:
      - .github/workflows/images-to-aws-s3.yml
      - images-to-aws-s3/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images-to-aws-s3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sam build
